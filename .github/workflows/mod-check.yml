name: PlayTime check

on:
  push:
    branches: [ playtime2 ]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build mod
        run: |
          dotnet build rimworld-mod/ModSyncPlayTime/Source/ModSyncPlayTime.csproj -c Release
          mkdir -p app/src/main/assets/playtime_mod/ModSyncPlayTime
          cp -r rimworld-mod/ModSyncPlayTime/About rimworld-mod/ModSyncPlayTime/Assemblies app/src/main/assets/playtime_mod/ModSyncPlayTime/
      - name: Compile app (debug)
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A3 build.log | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

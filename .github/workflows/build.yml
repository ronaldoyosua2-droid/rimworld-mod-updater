name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RimModUpdater.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RimModUpdater
          path: RimModUpdater.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RimMod Updater (build ${{ github.run_number }})
          body: Download **RimModUpdater.apk** di bawah, lalu install di HP.
          make_latest: true
          files: RimModUpdater.apk

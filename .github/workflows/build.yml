name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Decrypt signing key
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          if [ -z "$SIGNING_PASS" ]; then
            echo "::error::Secret SIGNING_PASS belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.jks.enc -out signing/release.jks -pass env:SIGNING_PASS

      - name: Build APK
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          { grep -E "^e: " build.log; grep -E "What went wrong" -A6 build.log; } | grep -v "^> Task" | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Remove decrypted key
        if: always()
        run: rm -f signing/release.jks

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ModSyncUpdate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ModSyncUpdate
          path: ModSyncUpdate.apk

      - name: Release notes
        run: |
          {
            cat .github/release/INTRO.md
            echo
            echo "## ✨ What's new in build ${{ github.run_number }}"
            echo
            cat WHATS_NEW.md
            echo
            echo "---"
            echo
            cat .github/release/OUTRO.md
          } > release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ModSync Update (build ${{ github.run_number }})
          body_path: release_notes.md
          make_latest: true
          files: ModSyncUpdate.apk

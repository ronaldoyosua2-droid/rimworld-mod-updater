name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|> " -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SteamodUpdater.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SteamodUpdater
          path: SteamodUpdater.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Steamod Updater (build ${{ github.run_number }})
          body: Download **SteamodUpdater.apk** di bawah, lalu install di HP.
          make_latest: true
          files: SteamodUpdater.apk
